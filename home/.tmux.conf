# use the default shell
set-option -g default-shell $SHELL

# use C-a, since it's on the home row and easier to hit than C-b
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix
set -g base-index 1

# close a window in the middle and the rest renumber to fill the gap
set -g renumber-windows on

# easy config reload
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# vi is good
setw -g mode-keys vi

# give focus events to programs like vim
set -g focus-events on

set-option -g default-terminal tmux-256color

# use truecolor
set-option -sa terminal-features ',xterm-kitty:RGB'

# don't allow automatic window renaming
set-option -g allow-rename off

bind-key : command-prompt
bind-key r refresh-client
bind-key L clear-history

# longer scrollback buffer
set-option -g history-limit 3000

bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

# use vim-like keys for splits and windows
bind-key v split-window -h
bind-key s split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key S choose-tree

# move window left and right with Ctrl-Arrow Key
bind-key C-Left swap-window -t -1\; select-window -t -1
bind-key C-Right swap-window -t +1\; select-window -t +1

# smart pane switching with awareness of vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind-key C-o rotate-window

bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical
set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80

bind-key a last-pane
bind-key q display-panes
bind-key c new-window
bind-key t next-window
bind-key T previous-window

bind-key [ copy-mode
bind-key ] paste-buffer

# setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

set-window-option -g display-panes-time 1500

# set window notifications
setw -g monitor-activity off
set -g visual-activity off

# enable native Mac OS X copy/paste (might not be necessary)
# set-option -g default-command "/bin/bash -c 'which reattach-to-user-namespace >/dev/null && exec reattach-to-user-namespace $SHELL -l || exec $SHELL -l'"

# allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

# set escape time to 0
set -sg escape-time 0

# open panes in current path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# allow mouse
set -g mouse on

source "$TMUXCONFIG"

# tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# tmux resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
# restore pane contents
# set -g @resurrect-capture-pane-contents 'on'

# restore vim sessions
set -g @resurrect-strategy-vim 'session'

# Restore each assistant pane to its own conversation. The save hook writes
# `claude --resume <id>` or `codex resume <id>` after checking live process
# identity and a saved transcript. For OpenClaw it writes
# `openclaw tui --session <key>` from the session shown in the TUI footer, and
# for OpenCode `opencode --session <id>` from the session its CLI plugin
# recorded in @oc_session. Continuum calls this same hook.
# A pane the hook could not place keeps the command resurrect recorded, which
# these whole-word matches do not restart: it comes back as a shell rather than
# as somebody else's conversation. For claude and codex that is a full path.
# For OpenClaw it is a bare `openclaw` (the TUI overwrites its own argv), hence
# "openclaw tui" here rather than "openclaw". OpenCode's is usually a bare
# `opencode`, hence "opencode --session".
set -g @resurrect-processes 'claude codex "openclaw tui" "opencode --session"'
set -g @resurrect-hook-post-save-layout '~/.tmux/resurrect-assistants.sh'

# tokyo night theme (now powered by powerkit)
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_theme 'tokyo-night'
set -g @powerkit_theme_variant 'night'
set -g @powerkit_status_position 'bottom'
set -g @powerkit_separator_style 'normal'
set -g @powerkit_edge_separator_style 'normal'
set -g @powerkit_elements_spacing 'windows'
set -g @powerkit_active_window_fg 'white'
set -g @powerkit_window_index_padding 'false'
set -g @powerkit_active_window_icon ''
set -g @powerkit_window_command_icons 'fish=#{E:@sh_icon},bash=,claude=#{E:@cc_icon},codex=#{E:@cc_icon},openclaw=#{E:@cc_icon},opencode=#{E:@cc_icon}'
# Activity state for Claude / Codex / OpenClaw / OpenCode / fish panes, driven by
# ~/.config/.claude/hooks/tmux-status.sh (OpenClaw reaches it through the
# Gateway client in ~/.config/openclaw/tmux-status, OpenCode through the CLI
# plugin in ~/.config/opencode/plugins/tmux-status). That script writes the current
# glyph into pane-scoped @cc_icon / @sh_icon; these globals are the fallback
# for panes with no state yet, and are the plain icons used before.
# The values must stay comma-free -- powerkit splices them into a nested
# #{?...} conditional, where a comma would read as an argument separator.
set -g @cc_icon ''
set -g @sh_icon ''
# jump to the next Claude, Codex, OpenClaw or OpenCode session waiting on you: a pending prompt first,
# then any whose turn has finished. Press again to walk the rest.
bind-key u run-shell '~/.config/.claude/hooks/tmux-status.sh next'
# Codex publishes its chat name as pane_title via tui.terminal_title, then the
# thread id (" | 01a12f98-..."), which ~/.config/codex/hooks/tmux-status.sh finds
# the pane by. The s/// drops the id from the name.
# OpenCode titles the pane "OC | <session title>" (cut to 40 characters), or
# "OpenCode" on the home screen and before a session has a title; the s///
# drops the prefix, and "opencode" stands in for the rest.
# Name a Claude window after its /rename name, kept by the same script in
# @cc_name, and "claude" until it has one. An OpenClaw window takes its
# session label the same way; the gateway plugin keeps it in @cc_name. The
# stock format otherwise. Done as
# the window name, not the powerkit title, so choose-tree shows it too; a
# window you renamed by hand has automatic-rename off and keeps your name.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{==:#{pane_current_command},codex},#{?pane_title,#{s/ [|] [0-9a-f]+-[0-9a-f-]+[.][.][.].*$//:pane_title},codex},#{?#{==:#{pane_current_command},opencode},#{?#{m:OC | *,#{pane_title}},#{s/^OC [|] //:pane_title},opencode},#{?#{&&:#{||:#{==:#{pane_current_command},claude},#{==:#{pane_current_command},openclaw}},#{@cc_name}},#{@cc_name},#{pane_current_command}}}}}#{?pane_dead,[dead],}'
# No Claude Code hook fires on /rename, but it retitles the pane. Filtered to
# claude panes here: fish retitles on every command, a script spawn each.
set-hook -g pane-title-changed {
    if -F '#{&&:#{||:#{==:#{pane_current_command},codex},#{==:#{pane_current_command},opencode}},#{automatic-rename}}' {
        set-option -w automatic-rename on
    }
    if -F '#{==:#{pane_current_command},claude}' {
        run-shell -b '~/.config/.claude/hooks/tmux-status.sh name #{pane_id}'
    }
}
run -b '~/.config/.claude/hooks/tmux-status.sh names'
set -g @powerkit_session_icon "#{?0,,}"
set -g @powerkit_session_prefix_icon "#{?0,,}"
set -g @powerkit_session_copy_icon "#{?0,,}"
set -g @powerkit_plugins 'datetime'
set -g @powerkit_plugin_datetime_format 'time'
set -g @powerkit_plugin_datetime_icon 'none'
set -g @powerkit_plugin_no_icon_bg_style 'content'

# continuously save tmux environment
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run -b '~/.tmux/plugins/tpm/tpm'

# Render status-right on a timer instead of from #() jobs. tmux re-runs #() on
# every redraw per client, not on status-interval, which measured 60-85
# powerkit-render spawns/sec here. The daemon parks rendered text in an option
# and rewrites status-right to read it; it also takes over calling continuum's
# save script, which only ever sat in status-right to get invoked periodically.
# Ordering is not load-bearing: powerkit now loads through tpm's `run -b`, so
# it may set its own status-right after this starts. The daemon re-asserts
# its own on every cycle, so it reclaims it within one interval either way.
run -b '~/.tmux/status-right-daemon.sh'
