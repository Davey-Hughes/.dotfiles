# ff-route rules — sourced as bash. Edit freely, no restart needed.
#
# Decision order (first match wins):
#   1. $FF_PROFILE env var   — set by an app's .desktop file (e.g. Slack)
#   2. WORK_URL_PATTERNS     — hard work-only URLs, win regardless of source
#   3. WORK_TMUX_SESSIONS    — link came from a tmux pane in a work session
#   4. FALLBACK              — nothing matched
#
# Check any URL without opening it:  ff-route --explain <url>

# ---- profiles -------------------------------------------------------------
# Names as they appear in ~/.config/mozilla/firefox/profiles.ini
PROFILE_WORK=beaver
PROFILE_PERSONAL=dev-edition-default

# Where unmatched links go: personal | work | ask
FALLBACK=personal

# ---- tmux sessions treated as work ----------------------------------------
# Exact session names. Anything not listed is personal.
WORK_TMUX_SESSIONS=(
  compass
  cst
  beaver
)

# ---- URLs that are always work, whatever opened them ----------------------
# Bash extended regex, matched case-insensitively against the whole URL.
WORK_URL_PATTERNS=(
  # GitHub: only the work org. Other github.com URLs deliberately fall
  # through to the tmux rule, then to FALLBACK.
  '^https?://(www\.)?github\.com/beaver-home([/?#]|$)'

  # Work domains, and any subdomain of them
  '^https?://([a-z0-9-]+\.)*beaverhealth\.org([/?#]|$)'
  '^https?://([a-z0-9-]+\.)*mindchampion\.org([/?#]|$)'

  # Azure. Covers portal./dev./management.azure.com via the subdomain group.
  #
  # login.microsoftonline.com and *.visualstudio.com are deliberately absent,
  # so a sign-in stays in whatever browser sent you there. Navigation inside
  # Firefox never reaches this router, so an auth redirect from a page you
  # already have open follows its opener on its own. A rule here would be the
  # only thing able to pull a login into the other profile mid-flow.
  '^https?://([a-z0-9-]+\.)*azure\.com([/?#]|$)'
  '^https?://([a-z0-9-]+\.)*azure\.net([/?#]|$)'
  '^https?://([a-z0-9-]+\.)*azurewebsites\.net([/?#]|$)'
  '^https?://([a-z0-9-]+\.)*azure\.microsoft\.com([/?#]|$)'

  # Slack
  '^https?://([a-z0-9-]+\.)*slack\.com([/?#]|$)'

  # Asana
  '^https?://([a-z0-9-]+\.)*asana\.com([/?#]|$)'

  # Work SaaS — delete any you do not actually use
  '^https?://([a-z0-9-]+\.)*atlassian\.net([/?#]|$)'
  '^https?://([a-z0-9-]+\.)*linear\.app([/?#]|$)'
  '^https?://([a-z0-9-]+\.)*notion\.(so|site)([/?#]|$)'
)

# ---- URLs that are always personal ---------------------------------------
# Checked before WORK_URL_PATTERNS, so use this to carve an exception out of a
# work rule, e.g. a personal repo under a work domain. Note $FF_PROFILE still
# wins over these: a link clicked in Slack goes to work regardless.
# Empty by default.
PERSONAL_URL_PATTERNS=(
)
