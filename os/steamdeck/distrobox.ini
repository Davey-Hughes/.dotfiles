# Declarative manifest for the Arch container that holds the CLI toolchain.
#
# Why a container at all: SteamOS re-images the rootfs on every update, and the
# pacman database lives at /usr/lib/holo/pacmandb *inside that image*. Packages
# installed with pacman on the host are therefore erased by each update -- and
# until then they spend a 5 GiB partition that ships ~4 GiB full. Podman keeps
# its storage in ~/.local/share/containers, which is on /home (943 GiB), so
# everything installed in here costs the rootfs nothing and survives updates.
#
# Apply:    distrobox assemble create --file distrobox.ini
# Rebuild:  distrobox assemble create --replace --file distrobox.ini
# Destroy:  distrobox assemble rm --file distrobox.ini
#
# Deliberately no `additional_packages` and no `exported_bins`, even though
# distrobox-assemble supports both: assemble runs them at create time, before
# an AUR helper exists inside the container. Half the package list would fail
# and every export of an AUR binary would fail with it. container-setup.sh does
# both instead, in an order that works, from container-packages.conf.

[arch]
image=archlinux:latest

# Pull a fresh image on create, but never silently replace a container that
# already exists -- a rebuild throws away anything installed by hand since.
# Pass --replace explicitly (see distrobox.sh --replace) when that is intended.
pull=true
replace=false
start_now=true

# No `home=` on purpose: the container shares the host $HOME. That is what makes
# `nvim` inside the container edit host files, read the stowed ~/.config/nvim,
# and use the host git config -- and it puts distrobox-export's wrappers
# directly into the ~/.local/bin that install.sh already pre-creates as a real
# directory. A private --home would isolate the container from the dotfiles this
# repo exists to deploy, which defeats the point.

# systemd inside the container buys nothing here: nothing in
# container-packages.conf ships a service. Skipping it keeps startup fast.
init=false
