# MELONDS IS A FLATPAK, SO ITS exe IS A LAUNCHER, NOT THE APPLICATION
#
# It is the only row here whose exe does not point at the thing being run. A
# flatpak has no stable executable on the host to aim at -- the app lives inside
# the runtime -- so Exe is flatpak itself and the app id rides in args. StartDir
# becomes /usr/bin/, which nothing cares about.
#
# Do not "fix" this by pointing at the .desktop or at an exports/bin wrapper:
# melonDS ships no wrapper in ~/.local/share/flatpak/exports/bin, and Steam runs
# Exe directly rather than through a desktop-file handler.
#
# wide is deliberately empty -- SteamGridDB has no 920x430 melonDS asset I could
# confirm, and empty means "leave whatever is there alone" rather than 404. To
# fill it, follow the re-pick instructions above using sgdb id 5246939.
