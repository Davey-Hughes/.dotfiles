# The non-Steam shortcuts this repo owns, one row each.
#
# Read by steam-shortcuts.py, which writes them into Steam's shortcuts.vdf and
# downloads their artwork. Everything a shortcut needs is here; the script has
# no per-application branches.
#
# WHY THE ARTWORK IS PINNED BY HASH
#
# The columns hold SteamGridDB CDN filenames, not search terms. Those filenames
# are immutable, so a restore two years from now puts back the picture that is
# on the Deck today rather than whatever ranks highest that morning. The cost is
# that a deleted upstream asset becomes a 404 -- the script says so and carries
# on, and the fix is to pick a new one and edit the row.
#
# To re-pick, open https://www.steamgriddb.com/game/<sgdb> and copy the hashed
# filename out of an asset's URL. That is the only reason the sgdb column
# exists; nothing reads it.
#
# Columns, pipe-separated:
#
#   key       short name, and the argument that limits a run to one shortcut
#   name      the entry's title in Steam; also how the script recognises a
#             shortcut it has already added, so renaming one here adds a second
#   sgdb      SteamGridDB game id, for re-picking art by hand. Unused by code.
#   appid     Steam's 32-bit id for the shortcut. PINNED, because the artwork
#             files are named after it -- change it and Steam finds no art.
#             For a new row, any unused value with the high bit set will do.
#   exe       what Steam runs. `~` is $HOME and `$REPO` is this checkout, so a
#             clone somewhere other than ~/.dotfiles still resolves. StartDir
#             is its directory; no row has ever wanted anything else.
#   args      LaunchOptions, or empty
#   desktop   ShortcutPath -- the .desktop Steam credits the entry to. Empty is
#             fine and means nothing more than that there is no such file.
#   icon      the icon Steam shows in the library list. A path, or `grid` to use
#             the icon downloaded into the artwork directory.
#   p         SteamGridDB grid asset, 600x900 (the portrait library capsule)
#   wide      SteamGridDB grid asset, 920x430 (the wide capsule)
#   hero      SteamGridDB hero asset (the banner behind the game page)
#   logo      SteamGridDB logo asset (drawn over the hero)
#   iconart   SteamGridDB icon asset. Only meaningful when icon is `grid`.
#
# Any art column may be empty, which means "leave whatever is there alone".
#
# THE FIVE PORTS POINT AT launch.sh, NOT AT THEIR APPIMAGES
#
# game-ports/install.sh replaces each appimage in place on every update, and the
# libultraship ports need $SHIP_HOME set or they put their saves wherever they
# were launched from. launch.sh is the thing that survives both. See its header.
#
# Their icons come from the appimage itself, extracted by game-ports/install.sh,
# so they are a path rather than `grid`: the picture already on disk is the
# project's own, and downloading a second copy of it would be silly.

# key        |name              |sgdb   |appid     |exe                                        |args      |desktop                                     |icon                             |p                                    |wide                                 |hero                                 |logo                                 |iconart
