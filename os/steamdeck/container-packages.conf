# Packages installed inside the `arch` distrobox, one per line.
#
#   name                 install only
#   name:bin             install, and export `bin` to ~/.local/bin
#   name:bin1,bin2       install, and export several binaries
#
# An exported binary becomes a small wrapper in ~/.local/bin that re-enters the
# container, so it is callable from the host shell like any other command.
# `~/.local/bin` is prepended to PATH by config/fish/steamdeck.fish.
#
# THE SPLIT RULE -- what belongs here versus on the host:
#
# Every exported binary pays a container round-trip (~100-300 ms) per
# invocation. That is invisible for something launched by hand and unusable for
# anything in a hot loop. So a tool goes on the HOST (packages.sh) when a shell
# runs it automatically -- starship redraws the prompt on every keystroke-ish
# event, zoxide hooks every cd, eza is aliased to ls -- and in HERE when a human
# types its name and waits. Moving starship into the container makes the shell
# feel broken; that is the one mistake this file exists to prevent.
#
# Anything with a GUI belongs in flatpaks.sh, and the terminal emulator itself
# has to be on the host (packages.sh) because it is what launches the shell.
#
# Sourced from chaotic-aur where available, so the -bin/-git entries below are
# prebuilt downloads rather than local compiles. See container-setup.sh.

# --- build toolchain -------------------------------------------------------
# Only here so paru can build the AUR packages that chaotic-aur does not carry.
# On the host these needed `glibc linux-api-headers` dragged in alongside,
# because the SteamOS image ships no kernel headers; base-devel covers it in a
# stock Arch container, so those two entries are gone.
base-devel
git
gcc:gcc,g++
llvm

# --- editor ----------------------------------------------------------------
neovim-nightly-bin:nvim

# --- interactive tools: launched by hand, latency does not matter -----------
yazi-git:yazi,ya
lazygit:lazygit
bottom:btm

# --- utilities -------------------------------------------------------------
shellcheck-bin:shellcheck
cloudflared-bin:cloudflared
