# The decompilation-based native ports, one row each.
#
# Read by BOTH install.sh (installs and updates them) and
# launch.sh (what the Steam shortcuts point at). It lives in its own
# file for exactly that reason: the launcher has to agree with the installer
# about where a port keeps its data, and two copies of that answer would drift
# the first time a port was added to one and not the other.
#
# Columns, pipe-separated:
#
#   key         short name; also the directory under ~/Applications and the
#               argument the Steam shortcut passes to launch.sh
#   name        display name, used in output and as the Steam entry's title
#   repo        GitHub owner/name to read releases from
#   asset       case-insensitive regex picking the Linux asset out of a release
#   data        data directory, relative to $XDG_DATA_HOME (~/.local/share)
#   datastyle   shiphome = the launcher exports SHIP_HOME to `data`
#               xdg      = the app chooses its own directory; `data` records
#                          where, and the launcher sets nothing
#   assetstyle  zip      = the asset is a zip to unpack
#               appimage = the asset IS the AppImage
#   dump        which game dump the port wants, for the missing-dump report
#
# The four Harbour Masters ports are libultraship and take SHIP_HOME.
# Dusklight is an unrelated project that ignores it and uses a proper XDG
# directory of its own, which is why datastyle is a column and not an
# assumption. See the header of install.sh for what that gets us.
#
# Adding a port is a row here. Anything a port needs beyond a row is a real
# difference and belongs in code.

soh|Ship of Harkinian|HarbourMasters/Shipwright|linux.*\.zip$|soh|shiphome|zip|Ocarina of Time (.z64)
2ship|2 Ship 2 Harkinian|HarbourMasters/2ship2harkinian|linux.*\.zip$|2ship|shiphome|zip|Majora's Mask (.z64)
lighthouse|Lighthouse|HarbourMasters/Lighthouse|linux.*\.zip$|lighthouse|shiphome|zip|Banjo-Kazooie (.z64)
spaghetti|SpaghettiKart|HarbourMasters/SpaghettiKart|linux.*\.zip$|spaghetti|shiphome|zip|Mario Kart 64 (.z64)
dusklight|Dusklight|TwilitRealm/dusklight|linux-x86_64\.AppImage$|TwilitRealm/Dusklight|xdg|appimage|Twilight Princess GameCube disc image (.rvz/.iso/.gcm)
