# herdr, the terminal workspace manager for AI coding agents.
# Every key with its default: `herdr --default-config`.
# Apply edits to a running server: `herdr server reload-config` (prefix+shift+r).

onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[update]
# herdr comes from the package manager (herdr-bin on Arch). `herdr update` is
# only for herdr's own installer, so there is nothing for this check to act on.
version_check = false

[worktrees]
# The default, ~/.herdr/worktrees, would add a dot-directory to $HOME.
directory = "~/.local/share/herdr/worktrees"

[keys]
# ctrl+b is Claude Code's "background this command" key, and ctrl+a is the tmux
# prefix. ctrl+q is free in fish, Claude Code, Neovim, tmux and Ghostty.
prefix = "ctrl+q"
# prefix+n / prefix+p walk agents, like the tmux keys walk windows. They are
# next_tab / previous_tab by default; tabs keep prefix+1..9. Both have to be
# cleared: `herdr config check` passes a key bound twice without saying which
# action gets it.
next_agent = "prefix+n"
previous_agent = "prefix+p"
next_tab = ""
previous_tab = ""

[ui]
# The tab row, "+" button included, shows only once a workspace has a second
# tab (prefix+c).
hide_tab_bar_when_single_tab = true
# prefix+b collapses the sidebar to nothing instead of a narrow status rail.
sidebar_collapsed_mode = "hidden"
# A distinct glyph for each agent state rather than colored dots.
status_indicators = "symbols"

# The second line of an agent's row is its session name alone, the name
# ~/.tmux/herdr-status.sh also gives the agent's tab. OpenCode titles the
# terminal "OC | " and the session title cut to 40 characters, so the
# herdr-session plugin in ~/.config/opencode/plugins reports the whole title as
# the pane token $session. Codex's title ends in its thread id; herdr-status.sh
# reports the name before it as $session. The first line leaves the tab out:
# its label is that same name.
#
# Claude's $session comes from herdr-status.sh too: its terminal title, the
# /rename name (before a rename, an auto-generated topic), with a zero-width
# space (U+200B) in front while that agent's turn has ended on a question.
# That is the pane token $asked its hooks report
# (~/.config/.claude/hooks/tmux-status.sh); herdr itself calls the turn done.
# A token can only be coloured by its own text, so the mark is in the name,
# where it takes no room, and the rule below turns the line red. The name only
# updates while herdr is open in a tmux pane, where that script runs.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "machine", "workspace"],
  [{ token = "$session", rules = [{ starts_with = "\u200B", fg = "#f7768e", bold = true }] }],
]
codex = [
  ["state_icon", "machine", "workspace"],
  ["$session"],
]
opencode = [
  ["state_icon", "machine", "workspace"],
  ["$session"],
]

# No notifications for now: no pop-ups and no sounds.
[ui.toast]
delivery = "off"

[ui.sound]
enabled = false
