# Route CMake C/C++ compiles through sccache (cache: ~/.cache/sccache).
#
# CMake reads these only on the FIRST configure of a build dir. An existing
# build dir keeps whatever it had; re-run cmake once with
#   -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
# to switch it over.
#
# Meson needs nothing here: it picks up sccache from PATH on its own.
# Rust is wired in $CARGO_HOME/config.toml ([build] rustc-wrapper).
#
# Deliberately its own file, not a line in xdg.conf -- that one is the systemd
# third of the three-way XDG sync enforced by tests/test-xdg-sync.sh.
#
# Linux/systemd only; takes effect after the next logout/login.
CMAKE_C_COMPILER_LAUNCHER=sccache
CMAKE_CXX_COMPILER_LAUNCHER=sccache
