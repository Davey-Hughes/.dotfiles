# Stop Neovide from tripping noice.nvim's GUI check at startup.
#
# Neovide's --startup-message-capture (ON by default) advertises ext_messages
# so it can surface errors thrown before the first grid render. Neovim sets
# ext_cmdline implicitly for any UI that asks for ext_messages -- see
# :help ui-option, "Sets ext_linegrid and ext_cmdline implicitly" -- so until
# that first render the UI list holds a client advertising both.
#
# noice.nvim polls nvim_list_uis() once a second and refuses to run against a
# GUI with any of ext_cmdline/ext_popupmenu/ext_messages set, so it fires
#
#   You're using a GUI that uses ext_cmdline. Noice can't work when the GUI
#   has ext_cmdline enabled.
#
# once per session. Measured on this machine: the flags clear ~32ms in, at the
# first render. That is what makes the error so confusing to chase -- by the
# time you run :checkhealth noice it reports the GUI as fine, because the
# client it complained about is already gone.
#
# The cost of turning capture off is real but small: a Neovim error early
# enough to precede the first render is no longer displayed in the window.
# Anything later still renders normally.
#
# Deliberately its own file, not a line in xdg.conf -- that one is the systemd
# third of the three-way XDG sync enforced by tests/test-xdg-sync.sh, and this
# is not an XDG variable.
#
# Not settable in config/neovide/config.toml: verified, the key is ignored
# there. The environment variable and the --no-startup-message-capture flag
# are the only two routes.
#
# Linux/systemd only; takes effect after the next logout/login.
NEOVIDE_STARTUP_MESSAGE_CAPTURE=0
