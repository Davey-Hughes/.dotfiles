# Initial user preferences. install.sh copies this once; Codex owns the live file.
model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"

sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[tui]
vim_mode_default = true
# The chat name names the tmux window. The thread id is how the status hooks
# find this pane -- Codex runs them in a shared daemon, not here -- and tmux
# drops it from the window name. Keep it after the name.
terminal_title = ["thread", "thread-id"]
theme = "tokyonight-moon"
