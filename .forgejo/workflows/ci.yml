# Forgejo Actions CI for the dotfiles (self-hosted runner on git.daveynet.xyz).
#
# A dotfiles repo has no build and no test binary: what it ships are files that
# some other program parses at login, on a machine you are usually in the middle
# of setting up. So the pipeline asks the three questions that repo can get
# wrong, and nothing else:
#
#   secrets   is anything tracked that must not be?  config/.claude/ is a LIVE
#             tool directory, and only a .gitignore allowlist keeps its sessions,
#             transcripts and OAuth state out of a published repo
#   parses    will every file this stows actually parse in the shell or program
#             that reads it, before that program is your login shell
#   installs  does install.sh work on a machine that is not already converged
#
# Forgejo specifics (vs GitHub): actions come from the code.forgejo.org mirror
# and are pinned by commit, and the job images are bare -- no fat preinstalled
# runner, so each job apt-gets exactly what it checks. Every job runs the same
# tests/*.sh you can run on a laptop; nothing is duplicated in YAML here.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The guard that decides whether a recursive rm on this machine gets a
  # confirmation prompt. Its own job, and first, because it is the one thing
  # here whose regression is measured in deleted files -- see the header of
  # config/.claude/hooks/rm-guard.sh for the three days it silently did nothing.
  rm-guard:
    runs-on: docker
    container:
      image: node:24-bookworm        # node + git, which the checkout action needs
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install python3
        run: apt-get update && apt-get install -y --no-install-recommends python3
      # The suite shells out to bash for the wrapper's degraded path, so bash
      # must be the real one, not the image's dash-as-sh.
      - name: Verdicts the guard must produce
        run: python3 config/.claude/hooks/test_rm_guard.py
      # ...and the verdicts it DID produce, for commands that really ran. The
      # suite asserts what somebody thought to write down; this replays a
      # snapshot of real ones, and it is what caught every regression in the
      # binding-clearing work -- three of them, all invisible to the suite.
      # Hermetic: the fixture is committed, and $HOME/$TMPDIR are pinned by the
      # script because safe_roots() folds both in and CI's $HOME is not the one
      # the fixture was recorded under.
      - name: Verdicts for real commands (anonymised corpus)
        run: python3 config/.claude/hooks/test_rm_guard_corpus.py

  # Everything that reads the tree without writing to it. One job: they share an
  # apt install and none takes long enough to be worth its own container.
  checks:
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # test-tracked-files.sh reads the committed blob of the Plasma
          # appletsrc to prove the wallpaper clean filter ran. A depth-1 clone
          # still has HEAD, which is all it needs -- but fetch-depth: 0 keeps
          # that true if the check ever grows to walk history.
          fetch-depth: 0
      - name: Install the parsers
        # python3-yaml, not pip: the check refuses to skip YAML in CI.
        # xz-utils for the shellcheck tarball below.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-yaml zsh fish xz-utils
      # Pinned to a release asset and checksummed BEFORE it reaches PATH, rather
      # than apt's shellcheck: the Debian version moves independently of the one
      # the tree was made clean against, and a lint gate that reports different
      # findings than the laptop did is a gate people stop believing. Update
      # both values together when bumping.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -eu
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/sc.tar.xz" | sha256sum -c - \
            || { echo "shellcheck checksum mismatch -- refusing to install" >&2; exit 1; }
          tar xJf /tmp/sc.tar.xz -C /tmp
          install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      # A real secret scanner, alongside the credential-shape regexes in
      # test-tracked-files.sh. Those regexes are this repo's own list of what a
      # secret looks like; gitleaks carries a maintained ruleset and finds
      # things the list does not. Pinned and checksummed for the same reason
      # shellcheck is: a scanner whose findings move on their own is one people
      # learn to ignore.
      #
      # It earns its place because of what the tree now holds. Most files here
      # are hand-written config, but config/.claude/hooks/rm_guard_corpus.jsonl
      # is 295 real commands lifted from session transcripts and rewritten --
      # the one tracked file whose content nobody composed line by line, and so
      # the one where a regex list is least likely to be enough.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -eu
          curl -fsSL -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gl.tar.gz" | sha256sum -c - \
            || { echo "gitleaks checksum mismatch -- refusing to install" >&2; exit 1; }
          tar xzf /tmp/gl.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Scans a copy containing exactly the TRACKED files, which is not what
      # `gitleaks dir .` does: that walks the working directory and ignores
      # .gitignore entirely. On a CI checkout the two agree, so the bug would
      # never have surfaced here -- but on a laptop it reads
      # config/.claude/projects/, a gigabyte of session transcripts this repo
      # exists to keep OUT, and reports their contents as findings against the
      # repo. A gate that means something different on a developer's machine
      # than in CI is one nobody trusts twice.
      - name: No secrets in the tracked tree
        run: |
          set -eu
          T=$(mktemp -d)
          # -f skips the two submodule paths, which git ls-files reports as
          # entries but which are directories on disk. Left to `cp` they error,
          # and under `set -e` that aborts the step -- a scanner that fails to
          # run looks exactly like a scanner that found nothing.
          git ls-files -z | while IFS= read -r -d '' f; do
            [ -f "$f" ] && cp --parents "$f" "$T"
          done
          gitleaks dir "$T" --no-banner --redact --exit-code 1
          rm -rf "${T:?}"
      # Deliberately the FIRST of the repo's own checks and its own step: it is
      # the only failure here that a later commit cannot undo.
      - name: Nothing sensitive is tracked
        run: ./tests/test-tracked-files.sh
      - name: Documentation references resolve
        run: ./tests/test-docs.sh
      - name: The three XDG env files agree
        run: ./tests/test-xdg-sync.sh
      - name: Everything parses, and the scripts lint
        run: ./tests/test-syntax.sh
      - name: save-bridge
        run: ./tests/test-save-bridge.sh

  # The only job that runs install.sh. Container-only by nature: it provisions a
  # throwaway $HOME and stows into it, which is not something to do on a laptop
  # by accident -- though tests/test-install.sh is safe to run there too, since
  # it confines itself to a mktemp dir.
  install:
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install stow
        run: apt-get update && apt-get install -y --no-install-recommends stow
      # Debian ships stow 2.3.1 where macOS Homebrew has 2.4.x, and install.sh
      # parses stow's conflict messages by hand (backup_conflicts). Those strings
      # are not a stable interface, so running the older one here is coverage,
      # not an accident of the base image.
      - name: install.sh against a fresh $HOME
        run: ./tests/test-install.sh
